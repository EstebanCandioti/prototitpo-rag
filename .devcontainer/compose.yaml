services:
  app:
    image: mcr.microsoft.com/devcontainers/javascript-node:1-22-bookworm
    command: sleep infinity
    volumes:
      - ../..:/workspaces:cached
    environment:
      # Credenciales exclusivas de esta base de prueba, sin puertos publicados.
      DATABASE_URL: postgresql://rag:rag_demo_local@postgres:5432/rag_demo
      URL_EMBEDDINGS: http://ollama:11434/v1
      MODELO_EMBEDDINGS: bge-m3
      DIMENSIONES: "1024"
      PROVEEDOR_CHAT: openai
      URL_CHAT: https://api.openai.com/v1
      MODELO_CHAT: gpt-6-luna
      UMBRAL: "0.55"
      PUERTO_WEB: "3000"
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
  postgres:
    image: pgvector/pgvector:pg17-bookworm
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag_demo_local
      POSTGRES_DB: rag_demo
    volumes:
      # Codespaces ajusta permisos del workspace; PGDATA necesita conservar los
      # del usuario postgres, por eso usa un volumen administrado por Docker.
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag_demo"]
      interval: 3s
      timeout: 3s
      retries: 30
  ollama:
    image: ollama/ollama:latest
    environment:
      OLLAMA_KEEP_ALIVE: "-1"
      OLLAMA_NUM_PARALLEL: "1"
    volumes:
      - ../.codespaces-data/ollama:/root/.ollama

volumes:
  postgres-data:
